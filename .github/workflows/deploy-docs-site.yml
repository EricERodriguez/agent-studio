name: Deploy Docs Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "docs-site/package-lock.json"

      - name: Install dependencies
        working-directory: docs-site
        run: npm install

      - name: Build documentation site
        working-directory: docs-site
        run: npm run docs:build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Debug build output
        run: |
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          echo "Listing built files:"
          ls -la docs-site/docs/.vitepress/dist || true

      # Deploy using peaceiris/actions-gh-pages: publish built files to gh-pages branch

      # Publica a la rama gh-pages (usa GITHUB_TOKEN)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/docs/.vitepress/dist
          publish_branch: gh-pages
          # usa GITHUB_TOKEN por defecto; si prefieres un PAT usa: personal_token: ${{ secrets.PERSONAL_TOKEN }}
